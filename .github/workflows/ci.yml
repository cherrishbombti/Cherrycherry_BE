name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 같은 브랜치에 연속 push 하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: 자격증명 커밋 여부 확인
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env 가 커밋돼 있습니다. 자격증명은 커밋하지 않습니다."
            exit 1
          fi
          echo ".env 미커밋 확인 완료"

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        # 테스트는 H2 를 쓰므로 MySQL · Redis 컨테이너가 필요 없다.
        run: ./gradlew build --stacktrace

      - name: 테스트 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  schema:
    name: 스키마 검증
    runs-on: ubuntu-latest

    # 빈 MySQL 에 마이그레이션을 돌리고 ddl-auto: validate 로 엔티티와 대조한다.
    # 엔티티만 바꾸고 마이그레이션을 빼먹으면 여기서 잡힌다. H2 로는 검증할 수 없다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: getit_schema_test
          MYSQL_USER: getit
          MYSQL_PASSWORD: ci-getit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 마이그레이션 ↔ 엔티티 검증
        env:
          SCHEMA_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/getit_schema_test?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          SCHEMA_TEST_DB_USERNAME: getit
          SCHEMA_TEST_DB_PASSWORD: ci-getit
        run: ./gradlew schemaTest --stacktrace

      - name: 검증 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: schema-report
          path: build/reports/tests/schemaTest
          retention-days: 7
          if-no-files-found: ignore
