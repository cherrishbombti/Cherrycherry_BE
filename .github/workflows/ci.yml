name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', 'docs/**', '.gitignore' ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', 'docs/**', '.gitignore' ]

# 같은 브랜치에 연속 push 하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # 자격증명이 저장소에 들어오는 것을 막는다.
      # .env 뿐 아니라 로컬 설정 파일·인증서까지 함께 본다.
      - name: 자격증명 커밋 여부 확인
        run: |
          leaked=$(git ls-files | grep -E \
            '(^|/)\.env$|(^|/)\.env\.(local|dev|prod)|application-(local|dev|prod|secret)\.ya?ml$|\.(pem|p12|jks|key)$' \
            || true)
          if [ -n "$leaked" ]; then
            echo "::error::자격증명으로 보이는 파일이 커밋돼 있습니다."
            echo "$leaked"
            exit 1
          fi
          echo "자격증명 파일 미커밋 확인 완료"

      # gradle-wrapper.jar 가 .gitignore 의 *.jar 규칙에 걸려 빠졌던 사고가 있었다.
      # 이 스텝은 wrapper 가 없거나 변조됐을 때 원인을 명확히 알려준다.
      - name: Gradle Wrapper 존재 확인
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error file=gradle/wrapper/gradle-wrapper.jar::gradle-wrapper.jar 가 저장소에 없습니다."
            echo "  .gitignore 의 '*.jar' 규칙에 걸렸을 가능성이 높습니다."
            echo "  해결: .gitignore 에 '!gradle/wrapper/gradle-wrapper.jar' 추가 후 커밋"
            exit 1
          fi
          echo "gradle-wrapper.jar 확인 완료"

      - name: Gradle Wrapper 무결성 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      # 테스트는 src/test/resources/application.yaml 의 H2 설정으로 돌아간다.
      # 실제 DB·OAuth·JWT 자격증명 없이 통과해야 정상이다.
      # (Application.main() 의 .env 로딩은 테스트에서 실행되지 않는다)
      - name: 빌드 및 테스트
        run: ./gradlew build --stacktrace

      - name: 테스트 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 선택 잡 — 실패시키지 않고 경고만 남긴다.
  # 큰 PR 이 리뷰되지 못하고 revert 로 이어진 이력이 있어 추가했다.
  # 불필요하면 이 잡만 지우면 된다.
  # ─────────────────────────────────────────────────────────────
  pr-size:
    name: PR 크기 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 변경 규모 측정
        run: |
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"...HEAD -- . \
                  ':(exclude)**.md' ':(exclude)docs/**' | wc -l)
          LINES=$(git diff --numstat "$BASE"...HEAD -- . \
                  ':(exclude)**.md' ':(exclude)docs/**' \
                  | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "변경 파일 ${FILES}개 / 변경 줄 ${LINES}줄"
          if [ "$FILES" -gt 10 ] || [ "$LINES" -gt 300 ]; then
            echo "::warning::PR 이 큽니다 (파일 ${FILES}개, ${LINES}줄). 기준은 파일 10개 / 300줄입니다. 나눌 수 있는지 검토해주세요."
          else
            echo "적정 크기입니다."
          fi
