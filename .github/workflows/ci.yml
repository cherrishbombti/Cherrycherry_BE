name: CI

# 데모 전까지는 "빌드와 테스트가 통과하는가"만 본다.
#
# 이전 버전에는 포맷 검사(spotless)와 스키마 검증(Flyway) 잡이 있었으나,
# 두 도구 모두 프로젝트에 도입돼 있지 않아 모든 PR 이 항상 실패하고 있었다.
# 빨간불이 일상이 되면 진짜 실패를 아무도 읽지 않으므로 잡을 걷어냈다.
# 도입 논의는 데모 이후 이슈에서 이어간다.
#
# 스키마 사고(BE #42 priority NOT NULL, #43, #46 org_code 유니크)는
# 당분간 CI 가 아니라 리뷰에서 막는다.
# 엔티티를 고친 PR 은 본문에 스키마 변경점을 적고, 리뷰어가 이를 확인한다.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # paths-ignore 를 쓰지 않는다.
  # 이 잡을 required status check 로 걸어두면, 문서만 고친 PR 은
  # 체크가 아예 보고되지 않아 영원히 머지 대기 상태가 된다.

# 같은 브랜치에 연속 push 하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) 빌드 · 테스트
  # ─────────────────────────────────────────────────────────────
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # 자격증명이 저장소에 들어오는 것을 막는다.
      # .env 뿐 아니라 로컬 설정 파일·인증서·Firebase 키까지 함께 본다.
      - name: 자격증명 커밋 여부 확인
        run: |
          leaked=$(git ls-files | grep -E \
            '(^|/)\.env$|(^|/)\.env\.(local|dev|prod)|application-(local|dev|prod|secret)\.ya?ml$|\.(pem|p12|jks|key)$|firebase-adminsdk|service-account.*\.json$' \
            || true)
          if [ -n "$leaked" ]; then
            echo "::error::자격증명으로 보이는 파일이 커밋돼 있습니다."
            echo "$leaked"
            exit 1
          fi
          echo "자격증명 파일 미커밋 확인 완료"

      # gradle-wrapper.jar 가 .gitignore 의 *.jar 규칙에 걸려 빠졌던 사고가 있었다.
      # 이 스텝은 wrapper 가 없을 때 원인을 명확히 알려준다.
      - name: Gradle Wrapper 존재 확인
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error file=gradle/wrapper/gradle-wrapper.jar::gradle-wrapper.jar 가 저장소에 없습니다."
            echo "  .gitignore 의 '*.jar' 규칙에 걸렸을 가능성이 높습니다."
            echo "  해결: .gitignore 에 '!gradle/wrapper/gradle-wrapper.jar' 추가 후 커밋"
            exit 1
          fi
          echo "gradle-wrapper.jar 확인 완료"

      - name: Gradle Wrapper 무결성 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      # 테스트는 test 프로파일로 H2 를 쓴다. CI 에 .env 나 DB 가 없어도 통과한다.
      # 설정: src/test/resources/application-test.yaml
      - name: 빌드 및 테스트
        run: ./gradlew build --stacktrace

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::빌드 또는 테스트가 실패했습니다."
          echo "  로컬 재현:  ./gradlew build"
          echo ""
          echo "  컨텍스트 로딩에서 깨졌다면, 운영 설정에 새로 추가한 환경변수를"
          echo "  src/test/resources/application-test.yaml 에도 더미값으로 넣었는지 확인하세요."

      - name: 테스트 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 2) PR 크기 확인 — 실패시키지 않고 경고만 남긴다.
  #    큰 PR 이 리뷰되지 못하고 revert 로 이어진 이력이 있어 추가했다.
  #    불필요하면 이 잡만 지우면 된다.
  # ─────────────────────────────────────────────────────────────
  pr-size:
    name: PR 크기 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 변경 규모 측정
        run: |
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"...HEAD -- . \
                  ':(exclude)**.md' ':(exclude)docs/**' | wc -l)
          LINES=$(git diff --numstat "$BASE"...HEAD -- . \
                  ':(exclude)**.md' ':(exclude)docs/**' \
                  | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "변경 파일 ${FILES}개 / 변경 줄 ${LINES}줄"
          if [ "$FILES" -gt 10 ] || [ "$LINES" -gt 300 ]; then
            echo "::warning::PR 이 큽니다 (파일 ${FILES}개, ${LINES}줄). 기준은 파일 10개 / 300줄입니다. 나눌 수 있는지 검토해주세요."
          else
            echo "적정 크기입니다."
          fi
