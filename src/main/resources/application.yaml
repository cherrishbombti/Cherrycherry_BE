spring:
  # 서버 배포 환경(Docker/EC2 등)이 UTC여도 시각이 밀리지 않도록 타임존 고정
  # LocalDateTime은 타임존 정보를 갖지 않아, JVM 기본 타임존이 바뀌면
  # 표시 시각과 from/to 날짜 경계가 함께 틀어짐
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/api/auth/google/callback"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/api/auth/KAKAO/callback"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id



sns:
  google:
    url: https://accounts.google.com/o/oauth2/v2/auth
    token:
      url: https://oauth2.googleapis.com/token
    userinfo:
      url: https://www.googleapis.com/oauth2/v3/userinfo
    client:
      id: ${GOOGLE_CLIENT_ID}
      secret: ${GOOGLE_CLIENT_SECRET}
    callback:
      url: http://localhost:8080/login/oauth2/code/google
    scope: email,profile
  kakao:
    url: https://kauth.kakao.com/oauth/authorize
    token:
      url: https://kauth.kakao.com/oauth/token
    userinfo: https://kapi.kakao.com/v2/user/me
    client:
      id: "너의_카카오_ID"
      secret: "너의_카카오_SECRET"
    callback:
      url: http://localhost:8080/login/oauth2/code/kakao

jwt:
  secret: ${JWT_SECRET}
  expiration-time: ${JWT_EXPIRATION_TIME}
  # 리프레시 토큰 수명(ms). 기본 14일 — 회전(rotation) 없이 재사용되므로 access token보다 길게 잡는다.
  refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:1209600000}

encryption:
  # 건강정보(민감정보) AES 암호화 키. 16/24/32 바이트여야 한다.
  # 이 키가 바뀌면 기존에 저장된 값을 복호화할 수 없다.
  key: ${ENCRYPTION_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
logging:
  level:
    org.springframework.security.oauth2: DEBUG
    # 인증 성공 후 유저 정보를 불러오는 과정을 상세히 보여줍니다.

firebase:
  # 서비스 계정 키 경로. 파일은 secrets/ 아래에 두며 커밋하지 않는다.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:secrets/firebase-service-account.json}
  # 로컬·테스트에서 실제 발송을 막고 싶을 때 false
  enabled: ${FIREBASE_ENABLED:true}

frontend:
  redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth/callback}
