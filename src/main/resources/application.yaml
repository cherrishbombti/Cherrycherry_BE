spring:
  # 서버 배포 환경(Docker/EC2 등)이 UTC여도 시각이 밀리지 않도록 타임존 고정
  # LocalDateTime은 타임존 정보를 갖지 않아, JVM 기본 타임존이 바뀌면
  # 표시 시각과 from/to 날짜 경계가 함께 틀어짐
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  security:
    oauth2:
      client:
        registration:
          # 콜백 주소는 환경마다 달라 환경변수로 주입한다. 기본값은 로컬 개발용이라
          # 팀원은 .env 수정 없이 그대로 쓰면 된다.
          # 소셜 로그인은 현재 앱에서만 쓴다(기관 웹은 자체 로그인이라 이 경로를 타지 않는다).
          # 그래서 운영 값은 앱의 API_BASE_URL과 같은 호스트여야 하고, 구글·카카오 콘솔에도
          # 같은 값을 등록해야 한다 — 세 곳 중 하나라도 어긋나면 redirect_uri_mismatch가 난다.
          # 앱을 Cloudflare Pages 도메인으로 태울 거라면, Pages Function이 콜백 302를
          # 브라우저에 그대로 넘기는지 먼저 확인해야 한다(따라가 버리면 콜백이 깨진다).
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # 경로의 KAKAO 대문자는 카카오 콘솔에 등록된 redirect_uri와 맞춘 값이다.
            # 라우팅 자체는 SocialLoginTypeConverter가 대소문자를 흡수하므로 소문자여도 되지만,
            # 서버만 바꾸면 콘솔 등록값과 어긋나 redirect_uri_mismatch가 난다.
            redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/KAKAO/callback}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id



sns:
  google:
    url: https://accounts.google.com/o/oauth2/v2/auth
    token:
      url: https://oauth2.googleapis.com/token
    userinfo:
      url: https://www.googleapis.com/oauth2/v3/userinfo
    client:
      id: ${GOOGLE_CLIENT_ID}
      secret: ${GOOGLE_CLIENT_SECRET}
    callback:
      url: http://localhost:8080/login/oauth2/code/google
    scope: email,profile
  kakao:
    url: https://kauth.kakao.com/oauth/authorize
    token:
      url: https://kauth.kakao.com/oauth/token
    userinfo: https://kapi.kakao.com/v2/user/me
    client:
      id: "너의_카카오_ID"
      secret: "너의_카카오_SECRET"
    callback:
      url: http://localhost:8080/login/oauth2/code/kakao

jwt:
  secret: ${JWT_SECRET}
  # access token 수명(ms). 리프레시 토큰이 생겼으므로 짧게 잡는다 — 기본 1시간.
  # 발급된 access token은 만료 전까지 서버가 무효화할 수 없어, 짧을수록 탈취 피해가 줄어든다.
  expiration-time: ${JWT_EXPIRATION_TIME:3600000}
  # 리프레시 토큰 수명(ms). 기본 14일 — 회전(rotation) 없이 재사용되므로 access token보다 길게 잡는다.
  refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:1209600000}

encryption:
  # 건강정보(민감정보) AES 암호화 키. 16/24/32 바이트여야 한다.
  # 이 키가 바뀌면 기존에 저장된 값을 복호화할 수 없다.
  key: ${ENCRYPTION_KEY}

auth:
  refresh-cookie:
    # 로컬 http 환경에서 쿠키가 저장되지 않을 때만 false로 둔다. 배포에서는 반드시 true.
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
logging:
  level:
    org.springframework.security.oauth2: DEBUG
    # 인증 성공 후 유저 정보를 불러오는 과정을 상세히 보여줍니다.

firebase:
  # 서비스 계정 키 경로. 파일은 secrets/ 아래에 두며 커밋하지 않는다.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:secrets/firebase-service-account.json}
  # 로컬·테스트에서 실제 발송을 막고 싶을 때 false
  enabled: ${FIREBASE_ENABLED:true}

frontend:
  redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth/callback}
