# CI·로컬 테스트 전용 설정.
#
# 목적은 "스프링 컨텍스트가 정상적으로 뜨는지"만 확인하는 것이다.
# 실제 DB·외부 연동을 쓰지 않으므로 여기서 다 끊는다.
#
# 운영 설정(src/main/resources/application.yaml)은 ${DB_URL} 같은 환경변수를 요구하는데
# CI 에는 .env 가 없다. 그 자리를 이 파일이 덮어써야 컨텍스트가 뜬다.
# 새 환경변수를 운영 설정에 추가하면 여기에도 더미값을 같이 넣어야 CI 가 깨지지 않는다.

spring:
  datasource:
    url: jdbc:h2:mem:cherry_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    # 테스트마다 엔티티 기준으로 스키마를 새로 만든다.
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret

sns:
  google:
    client:
      id: test-google-client-id
      secret: test-google-client-secret
  kakao:
    client:
      id: test-kakao-client-id
      secret: test-kakao-client-secret

# HS256 서명 키는 최소 32바이트여야 한다 (JwtUtil 의 Keys.hmacShaKeyFor 제약).
jwt:
  secret: test-secret-key-for-ci-only-not-a-real-credential
  expiration-time: 3600000

# AES 키는 16/24/32 바이트여야 한다 (StringEncryptConverter 제약). 아래는 32바이트.
encryption:
  key: test-encryption-key-ci-only-32b!

cors:
  allowed-origins: http://localhost:5173

# 테스트에서 실제 FCM 발송을 막는다.
firebase:
  enabled: false
